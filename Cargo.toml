[package]
name = "learn_grammar"
version = "0.1.0"
edition = "2024"

[dependencies]
# 异步运行时
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }

# Web 框架
axum = "0.8"

# 数据库
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 错误处理
anyhow = "1"
thiserror = "2"

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

# 随机数
rand = "0.9"
