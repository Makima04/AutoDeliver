name: autodeliver

services:
  autodeliver:
    image: ${AUTODELIVER_IMAGE:-ghcr.io/makima04/autodeliver:latest}
    container_name: autodeliver
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/data
      - ./config.toml:/app/config.toml:ro
    ports:
      # 容器内端口固定 8080：同网络的 AstrBot 走 http://autodeliver:8080，改宿主机端口不影响它。
      # 宿主机侧默认 18080（8080 太容易被别的服务/路由器管理页撞上）。
      # 只想本机调试、不暴露局域网时：AUTODELIVER_BIND=127.0.0.1 docker compose up -d
      - "${AUTODELIVER_BIND:-0.0.0.0}:${AUTODELIVER_PORT:-18080}:8080"
    networks:
      - autodeliver
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  autodeliver:
    name: autodeliver
